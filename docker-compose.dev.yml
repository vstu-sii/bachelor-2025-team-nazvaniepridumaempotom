version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    command: npm run dev
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/cooking_assistant
      LLM_SERVICE_URL: http://llm-service:8001
      DEBUG: "true"
    depends_on:
      - db
    command: >
      sh -c "
        pip install -r requirements.txt &&
        uvicorn api.main:app --reload --host 0.0.0.0
      "
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cooking_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./llm-service/app:/app
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: >
      sh -c "
        pip install -r requirements.txt &&
        uvicorn main:app --reload --host 0.0.0.0 --port 8001
      "
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    build:
      context: ./llm-service
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  jupyter:
    image: jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ./llm-service/notebooks:/home/jovyan/work
      - ./llm-service/app:/home/jovyan/app
    environment:
      JUPYTER_TOKEN: dev123
      OLLAMA_HOST: http://ollama:11434
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
