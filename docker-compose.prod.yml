version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001"]
    restart: always

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/cooking_assistant
      LLM_SERVICE_URL: http://llm-service:8001
      ENVIRONMENT: production
      DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health"]
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    restart: always

  llm-service:
    build: ./llm-service
    environment:
      OLLAMA_HOST: http://ollama:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
    restart: always

  ollama:
    build:
      context: ./llm-service
      dockerfile: Dockerfile.ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
    deploy:
      resources:
        limits:
          memory: 16G
    restart: always

volumes:
  postgres_data:
  ollama_data:
