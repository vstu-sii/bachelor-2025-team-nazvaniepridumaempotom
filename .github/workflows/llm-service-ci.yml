name: LLM Service CI

on:
  push:
    branches: [ MLOPS ]
    paths:
      - 'llm-service/**'
  pull_request:
    branches: [ MLOPS ]
    paths:
      - 'llm-service/**'

jobs:
  test-llm-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./llm-service

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('llm-service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r app/requirements.txt
        pip install black flake8 isort mypy pytest pytest-cov pytest-asyncio
    
    - name: Check formatting with Black
      run: |
        black --check --diff app/
    
    - name: Lint with flake8
      run: |
        flake8 app/ --max-line-length=88 --extend-ignore=E203,W503
    
    - name: Sort imports with isort
      run: |
        isort --check-only --diff app/
    
    - name: Type checking with mypy
      run: |
        mypy app/ --ignore-missing-imports
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=app --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./llm-service/coverage.xml
        flags: llm-service

  build-docker:
    runs-on: ubuntu-latest
    needs: test-llm-service
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    defaults:
      run:
        working-directory: ./llm-service

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t llm-service:latest -f Dockerfile .
    
    - name: Test Docker image
      run: |
        docker run --rm llm-service:latest python -c "import sys; print('Python version:', sys.version)"
    
    - name: Build Ollama Docker image
      run: |
        docker build -t llm-service-ollama:latest -f Dockerfile.ollama .
    
    - name: Save Docker images
      uses: actions/upload-artifact@v3
      with:
        name: docker-images
        path: |
          llm-service/
        retention-days: 7