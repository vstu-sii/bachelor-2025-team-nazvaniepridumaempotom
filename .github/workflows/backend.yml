name: Backend CI

on:
  push:
    branches: [ MLOPS ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ MLOPS]
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8 isort mypy pytest pytest-cov
    
    - name: Check formatting with Black
      run: |
        black --check --diff api/ crud/ models/ schemas/ services/
    
    - name: Lint with flake8
      run: |
        flake8 api/ crud/ models/ schemas/ services/ --max-line-length=88
    
    - name: Sort imports with isort
      run: |
        isort --check-only --diff api/ crud/ models/ schemas/ services/
    
    - name: Type checking with mypy
      run: |
        mypy api/ crud/ models/ schemas/ services/ --ignore-missing-imports
    
    - name: Run tests with pytest
      env:
        DATABASE_URL: sqlite:///./test.db
      run: |
        pytest tests/ -v --cov=. --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend