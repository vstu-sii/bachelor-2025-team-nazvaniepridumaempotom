name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff backend/src

      - name: Tests
        run: pytest backend/tests

      - name: Build Docker image
        run: docker build backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Tests
        run: |
          cd frontend
          npm test

      - name: Build Docker image
        run: docker build frontend
