name: CI Pipeline

on:
  push:
    branches: [d2-ai, fullstack, MLOPS]
  pull_request:
    branches: [MLOPS]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: pip install black flake8 isort
      - name: Check formatting with Black
        run: cd backend && black --check .
      - name: Lint with flake8
        run: cd backend && flake8 .

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd backend
          pytest -v --cov=./ --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run lint
        run: cd frontend && npm run lint --if-present || echo "No lint script"
      - name: Run tests
        run: cd frontend && npm test --if-present || echo "No tests"

  test-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd llm-service
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: |
          cd llm-service
          pytest -v || echo "No tests found"

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-llm]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: backend:test
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: frontend:test
      - name: Build llm-service
        uses: docker/build-push-action@v5
        with:
          context: ./llm-service
          push: false
          tags: llm-service:test
      - name: Verify docker-compose
        run: docker-compose config

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/fullstack'
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: |
          docker-compose up -d
          sleep 15
      - name: Health check
        run: |
          curl -f http://localhost:8000/health || echo "Backend health check failed"
          curl -f http://localhost:3000 || echo "Frontend health check failed"