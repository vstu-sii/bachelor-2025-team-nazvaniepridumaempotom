name: CI/CD Pipeline

on:
  push:
    branches: [ fullstackkk, d2-ai, MLOPS ]
  pull_request:
    branches: [ fullstackkk, d2-ai, MLOPS ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  MODEL_BRANCH: d2-ai
  APP_BRANCH: fullstackkk
  CONFIG_BRANCH: MLOPS

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}

      - name: Check frontend exists
        run: |
          test -d frontend
          test -f frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test --if-present

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}

      - name: Check backend exists
        run: |
          test -d backend
          test -f backend/requirements.txt

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format check
        working-directory: backend
        run: black --check .

      - name: Lint
        working-directory: backend
        run: flake8 .

      - name: Tests
        working-directory: backend
        run: pytest -v

  test-llm-service:
    name: Test LLM Service
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/d2-ai'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MODEL_BRANCH }}

      - name: Check structure
        run: |
          test -f requirements.txt
          ls *.py

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format & lint
        run: |
          black --check .
          flake8 .

      - name: Tests
        run: pytest -v

  test-ollama-integration:
    name: Ollama Integration
    runs-on: ubuntu-latest
    needs: test-llm-service

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MODEL_BRANCH }}

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install requests pytest

      - name: Check Ollama API
        run: |
          curl -f http://localhost:11434/api/tags

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-llm-service]
    if: github.event_name != 'pull_request'

    steps:
      - name: Create build context directory
        run: mkdir -p docker-context

      - name: Checkout app code (frontend/backend)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}
          path: docker-context/app

      - name: Checkout model code (LLM service)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MODEL_BRANCH }}
          path: docker-context/model

      - name: Checkout config files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_BRANCH }}
          path: docker-context/config

      - name: Verify all files exist
        run: |
          echo "Checking app files:"
          ls -la docker-context/app/
          
          echo "Checking model files:"
          ls -la docker-context/model/
          
          echo "Checking config files:"
          ls -la docker-context/config/frontend/
          ls -la docker-context/config/backend/
          ls -la docker-context/config/llm-service/

      - name: Prepare frontend build context
        run: |
          mkdir -p docker-context/frontend-build
          cp -r docker-context/app/frontend/* docker-context/frontend-build/
          cp docker-context/config/frontend/Dockerfile.dev docker-context/frontend-build/Dockerfile
          echo "Frontend context ready:"
          ls -la docker-context/frontend-build/

      - name: Prepare backend build context
        run: |
          mkdir -p docker-context/backend-build
          cp -r docker-context/app/backend/* docker-context/backend-build/
          cp docker-context/config/backend/Dockerfile.dev docker-context/backend-build/Dockerfile
          echo "Backend context ready:"
          ls -la docker-context/backend-build/

      - name: Prepare llm-service build context
        run: |
          mkdir -p docker-context/llm-service-build
          cp -r docker-context/model/* docker-context/llm-service-build/
          cp docker-context/config/llm-service/Dockerfile docker-context/llm-service-build/Dockerfile
          echo "LLM service context ready:"
          ls -la docker-context/llm-service-build/

      - name: Build Frontend Docker image
        run: |
          cd docker-context/frontend-build
          docker build -t frontend:latest -f Dockerfile .

      - name: Build Backend Docker image
        run: |
          cd docker-context/backend-build
          docker build -t backend:latest -f Dockerfile .

      - name: Build LLM Service Docker image
        run: |
          cd docker-context/llm-service-build
          docker build -t llm-service:latest -f Dockerfile .