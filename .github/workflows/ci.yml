name: CI/CD Pipeline

on:
  push:
    branches: [ fullstackkk, d2-ai, MLOPS ]
  pull_request:
    branches: [ fullstackkk, d2-ai, MLOPS ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  MODEL_BRANCH: d2-ai
  APP_BRANCH: fullstackkk
  CONFIG_BRANCH: MLOPS

jobs:
  # ПАРАЛЛЕЛЬНЫЕ ТЕСТЫ
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}

      - name: Check frontend structure
        run: |
          if [ ! -d "frontend" ]; then
            echo "⚠️ Frontend directory not found! Skipping tests."
            exit 0
          fi
          echo "Frontend found. Contents:"
          ls -la frontend/

      - uses: actions/setup-node@v4
        if: ${{ success() }}
        with:
          node-version: 18

      - name: Install dependencies
        if: ${{ success() }}
        working-directory: frontend
        run: |
          if [ ! -f "package.json" ]; then
            echo "⚠️ No package.json found. Skipping."
            exit 0
          fi
          
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        if: ${{ success() }}
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json; then
            npm test || echo "⚠️ Tests failed but continuing..."
          else
            echo "📝 No test script found"
          fi

      - name: Run lint
        if: ${{ success() }}
        working-directory: frontend
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint || echo "⚠️ Lint failed but continuing..."
          else
            echo "📝 No lint script found"
          fi

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}

      - name: Check backend structure
        run: |
          if [ ! -d "backend" ]; then
            echo "⚠️ Backend directory not found! Skipping tests."
            exit 0
          fi
          echo "Backend found. Contents:"
          ls -la backend/

      - uses: actions/setup-python@v4
        if: ${{ success() }}
        with:
          python-version: 3.11

      - name: Install Python dependencies
        if: ${{ success() }}
        working-directory: backend
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "⚠️ No requirements.txt. Installing minimal deps..."
            pip install black flake8 pytest
          else
            pip install -r requirements.txt black flake8 pytest
          fi

      - name: Format with Black
        if: ${{ success() }}
        working-directory: backend
        run: |
          black . || echo "⚠️ Black formatting issue"

      - name: Lint with flake8
        if: ${{ success() }}
        working-directory: backend
        run: |
          flake8 . --max-line-length=88 || echo "⚠️ Linting issues found"

      - name: Run Python tests
        if: ${{ success() }}
        working-directory: backend
        run: |
          pytest -v || echo "⚠️ Tests failed"

  test-llm-service:
    name: Test LLM Service
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/d2-ai' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MODEL_BRANCH }}

      - name: Check LLM service structure
        run: |
          echo "LLM service contents:"
          ls -la

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          if [ ! -f "requirements.txt" ]; then
            echo "⚠️ No requirements.txt. Installing minimal deps..."
            pip install fastapi uvicorn pydantic black flake8 pytest
          else
            pip install -r requirements.txt black flake8 pytest
          fi

      - name: Format and lint
        run: |
          black . || echo "⚠️ Black formatting issue"
          flake8 . --max-line-length=88 || echo "⚠️ Linting issues"

      - name: Run tests
        run: |
          pytest -v || echo "⚠️ Tests failed"

  # ПАРАЛЛЕЛЬНАЯ СБОРКА DOCKER КОНТЕЙНЕРОВ
  build-frontend:
    name: Build Frontend Docker
    runs-on: ubuntu-latest
    needs: []  # Запускаем независимо от тестов
    continue-on-error: true
    
    steps:
      - name: Prepare workspace
        run: mkdir -p docker-context

      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}
          path: app-source

      - name: Checkout config files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_BRANCH }}
          path: config-source

      - name: Prepare frontend build context
        run: |
          mkdir -p docker-context/frontend
          
          # Копируем исходный код
          if [ -d "app-source/frontend" ]; then
            cp -r app-source/frontend/* docker-context/frontend/ || echo "⚠️ Some files failed to copy"
          else
            echo "⚠️ No frontend source found. Creating placeholder..."
            echo '{"name":"frontend"}' > docker-context/frontend/package.json
          fi
          
          # Копируем Dockerfile
          if [ -f "config-source/frontend/Dockerfile" ]; then
            cp config-source/frontend/Dockerfile docker-context/frontend/
          elif [ -f "config-source/frontend/Dockerfile.dev" ]; then
            cp config-source/frontend/Dockerfile.dev docker-context/frontend/Dockerfile
          else
            echo "⚠️ No Dockerfile found. Using default..."
            cat > docker-context/frontend/Dockerfile << 'EOF'
FROM node:18-alpine
WORKDIR /app
COPY package*.json ./
RUN npm install
COPY . .
EXPOSE 3000
CMD ["npm", "start"]
EOF
          fi
          
          echo "Frontend build context:"
          ls -la docker-context/frontend/

      - name: Build Docker image
        run: |
          if [ -f "docker-context/frontend/Dockerfile" ]; then
            echo "🔨 Building frontend Docker image..."
            docker build -t frontend:${{ github.sha }} docker-context/frontend/
            docker tag frontend:${{ github.sha }} frontend:latest
            echo "✅ Frontend image built successfully"
          else
            echo "❌ No Dockerfile found, skipping build"
          fi

      - name: Save image as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: |
            !docker-context/
            !app-source/
            !config-source/
          retention-days: 1

  build-backend:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    needs: []  # Запускаем независимо
    continue-on-error: true
    
    steps:
      - name: Prepare workspace
        run: mkdir -p docker-context

      - name: Checkout app code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}
          path: app-source

      - name: Checkout config files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_BRANCH }}
          path: config-source

      - name: Prepare backend build context
        run: |
          mkdir -p docker-context/backend
          
          # Копируем исходный код
          if [ -d "app-source/backend" ]; then
            cp -r app-source/backend/* docker-context/backend/ || echo "⚠️ Some files failed to copy"
          else
            echo "⚠️ No backend source found. Creating placeholder..."
            echo "flask" > docker-context/backend/requirements.txt
          fi
          
          # Копируем Dockerfile
          if [ -f "config-source/backend/Dockerfile" ]; then
            cp config-source/backend/Dockerfile docker-context/backend/
          elif [ -f "config-source/backend/Dockerfile.dev" ]; then
            cp config-source/backend/Dockerfile.dev docker-context/backend/Dockerfile
          else
            echo "⚠️ No Dockerfile found. Using default..."
            cat > docker-context/backend/Dockerfile << 'EOF'
FROM python:3.11-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
EXPOSE 5000
CMD ["python", "app.py"]
EOF
          fi
          
          echo "Backend build context:"
          ls -la docker-context/backend/

      - name: Build Docker image
        run: |
          if [ -f "docker-context/backend/Dockerfile" ]; then
            echo "🔨 Building backend Docker image..."
            docker build -t backend:${{ github.sha }} docker-context/backend/
            docker tag backend:${{ github.sha }} backend:latest
            echo "✅ Backend image built successfully"
          else
            echo "❌ No Dockerfile found, skipping build"
          fi

      - name: Save image as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: |
            !docker-context/
            !app-source/
            !config-source/
          retention-days: 1

  build-llm-service:
    name: Build LLM Service Docker
    runs-on: ubuntu-latest
    needs: []  # Запускаем независимо
    continue-on-error: true
    
    steps:
      - name: Prepare workspace
        run: mkdir -p docker-context

      - name: Checkout model code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MODEL_BRANCH }}
          path: model-source

      - name: Checkout config files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_BRANCH }}
          path: config-source

      - name: Prepare llm-service build context
        run: |
          mkdir -p docker-context/llm-service
          
          # Копируем исходный код
          if [ -d "model-source" ]; then
            cp -r model-source/* docker-context/llm-service/ || echo "⚠️ Some files failed to copy"
          else
            echo "⚠️ No model source found. Creating placeholder..."
            echo "fastapi" > docker-context/llm-service/requirements.txt
          fi
          
          # Копируем Dockerfile
          if [ -f "config-source/llm-service/Dockerfile" ]; then
            cp config-source/llm-service/Dockerfile docker-context/llm-service/
          elif [ -f "config-source/llm-service/Dockerfile.dev" ]; then
            cp config-source/llm-service/Dockerfile.dev docker-context/llm-service/Dockerfile
          else
            echo "⚠️ No Dockerfile found. Using default..."
            cat > docker-context/llm-service/Dockerfile << 'EOF'
FROM python:3.11-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
EXPOSE 8000
CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
EOF
          fi
          
          echo "LLM service build context:"
          ls -la docker-context/llm-service/

      - name: Build Docker image
        run: |
          if [ -f "docker-context/llm-service/Dockerfile" ]; then
            echo "🔨 Building LLM service Docker image..."
            docker build -t llm-service:${{ github.sha }} docker-context/llm-service/
            docker tag llm-service:${{ github.sha }} llm-service:latest
            echo "✅ LLM service image built successfully"
          else
            echo "❌ No Dockerfile found, skipping build"
          fi

      - name: Save image as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llm-service-image
          path: |
            !docker-context/
            !model-source/
            !config-source/
          retention-days: 1

  # ЗАПУСК КОНТЕЙНЕРОВ И ИНТЕГРАЦИОННЫЕ ТЕСТЫ
  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-llm-service]  # Зависим от сборки, но продолжаем при ошибках
    continue-on-error: true
    if: always()  # Запускаем даже если предыдущие jobs упали

    steps:
      - name: Download all images
        run: |
          echo "📥 Checking available Docker images..."
          docker images

      - name: Start backend container
        continue-on-error: true
        run: |
          echo "🚀 Starting backend container..."
          docker run -d --name test-backend -p 5000:5000 backend:latest || echo "⚠️ Failed to start backend"
          sleep 5
          
          echo "🔍 Checking backend health..."
          curl -f http://localhost:5000/ || echo "⚠️ Backend not responding"

      - name: Start LLM service container
        continue-on-error: true
        run: |
          echo "🚀 Starting LLM service container..."
          docker run -d --name test-llm -p 8000:8000 llm-service:latest || echo "⚠️ Failed to start LLM service"
          sleep 5
          
          echo "🔍 Checking LLM service health..."
          curl -f http://localhost:8000/ || echo "⚠️ LLM service not responding"

      - name: Start frontend container
        continue-on-error: true
        run: |
          echo "🚀 Starting frontend container..."
          docker run -d --name test-frontend -p 3000:3000 frontend:latest || echo "⚠️ Failed to start frontend"
          sleep 5
          
          echo "🔍 Checking frontend container..."
          docker ps | grep frontend || echo "⚠️ Frontend container not running"

      - name: Test inter-service communication
        continue-on-error: true
        run: |
          echo "🔗 Testing service communication..."
          
          # Проверяем, какие сервисы запущены
          echo "Running containers:"
          docker ps --format "table {{.Names}}\t{{.Status}}"
          
          # Простой тест связи между сервисами
          if docker ps | grep -q test-backend; then
            echo "✅ Backend is running"
          else
            echo "❌ Backend is not running"
          fi
          
          if docker ps | grep -q test-llm; then
            echo "✅ LLM service is running"
          else
            echo "❌ LLM service is not running"
          fi
          
          if docker ps | grep -q test-frontend; then
            echo "✅ Frontend is running"
          else
            echo "❌ Frontend is not running"
          fi

      - name: Cleanup containers
        if: always()
        run: |
          echo "🧹 Cleaning up test containers..."
          docker rm -f test-backend test-llm test-frontend 2>/dev/null || true

  # ФИНАЛЬНЫЙ ОТЧЕТ
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-llm-service, build-frontend, build-backend, build-llm-service, run-integration-tests]
    if: always()  # Всегда запускаем финальный отчет
    
    steps:
      - name: Generate status report
        run: |
          echo "📊 ===== CI/CD PIPELINE REPORT ====="
          echo ""
          echo "🔧 TEST STATUS:"
          echo "Frontend tests: ${{ needs.test-frontend.result || 'NOT_RUN' }}"
          echo "Backend tests: ${{ needs.test-backend.result || 'NOT_RUN' }}"
          echo "LLM service tests: ${{ needs.test-llm-service.result || 'NOT_RUN' }}"
          echo ""
          echo "🐳 BUILD STATUS:"
          echo "Frontend build: ${{ needs.build-frontend.result || 'NOT_RUN' }}"
          echo "Backend build: ${{ needs.build-backend.result || 'NOT_RUN' }}"
          echo "LLM service build: ${{ needs.build-llm-service.result || 'NOT_RUN' }}"
          echo ""
          echo "🚀 DEPLOYMENT STATUS:"
          echo "Integration tests: ${{ needs.run-integration-tests.result || 'NOT_RUN' }}"
          echo ""
          echo "✅ Overall pipeline status: ${{ job.status }}"
          echo "📈 Some components may have failed but pipeline continued."
          
          # Сохраняем отчет как артефакт
          echo "📊 ===== CI/CD PIPELINE REPORT =====" > report.md
          echo "" >> report.md
          echo "## Test Status" >> report.md
          echo "- Frontend tests: ${{ needs.test-frontend.result || 'NOT_RUN' }}" >> report.md
          echo "- Backend tests: ${{ needs.test-backend.result || 'NOT_RUN' }}" >> report.md
          echo "- LLM service tests: ${{ needs.test-llm-service.result || 'NOT_RUN' }}" >> report.md
          echo "" >> report.md
          echo "## Build Status" >> report.md
          echo "- Frontend build: ${{ needs.build-frontend.result || 'NOT_RUN' }}" >> report.md
          echo "- Backend build: ${{ needs.build-backend.result || 'NOT_RUN' }}" >> report.md
          echo "- LLM service build: ${{ needs.build-llm-service.result || 'NOT_RUN' }}" >> report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: report.md
          retention-days: 7